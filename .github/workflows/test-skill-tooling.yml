name: Test skill tooling

on:
  pull_request:
    paths:
      - 'skills/lithium-battery-academic-search/mcp-server/**'
      - 'skills/lithium-battery-citation/**'
      - 'skills/lithium-battery-downloader/**'
      - 'skills/lithium-battery-figure/**'
      - 'skills/lithium-battery-image2ppt/**'
      - 'skills/lithium-battery-paper-card/**'
      - 'skills/lithium-battery-proposal-writer/**'
      - 'skills/lithium-battery-paper-to-patent/**'
      - 'skills/lithium-battery-response/**'
      - 'skills/lithium-battery-reviewer/**'
      - 'skills/lithium-battery-shared/**'
      - 'scripts/update-codex-skills.sh'
      - 'scripts/autoupdate-skills.sh'
      - 'scripts/tests/test-autoupdate-state-isolation.sh'
      - 'scripts/tests/test-update-codex-skills-safety.sh'
      - 'scripts/tests/test-update-codex-skills-dest-tilde.sh'
      - 'scripts/tests/test-autoupdate-dest-tilde.sh'
      - '.github/requirements-ci.txt'
      - '.github/workflows/test-skill-tooling.yml'
  push:
    branches:
      - main
    paths:
      - 'skills/lithium-battery-academic-search/mcp-server/**'
      - 'skills/lithium-battery-citation/**'
      - 'skills/lithium-battery-downloader/**'
      - 'skills/lithium-battery-figure/**'
      - 'skills/lithium-battery-image2ppt/**'
      - 'skills/lithium-battery-paper-card/**'
      - 'skills/lithium-battery-proposal-writer/**'
      - 'skills/lithium-battery-paper-to-patent/**'
      - 'skills/lithium-battery-response/**'
      - 'skills/lithium-battery-reviewer/**'
      - 'skills/lithium-battery-shared/**'
      - 'scripts/update-codex-skills.sh'
      - 'scripts/autoupdate-skills.sh'
      - 'scripts/tests/test-autoupdate-state-isolation.sh'
      - 'scripts/tests/test-update-codex-skills-safety.sh'
      - 'scripts/tests/test-update-codex-skills-dest-tilde.sh'
      - 'scripts/tests/test-autoupdate-dest-tilde.sh'
      - '.github/requirements-ci.txt'
      - '.github/workflows/test-skill-tooling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            .github/requirements-ci.txt
            skills/lithium-battery-academic-search/mcp-server/requirements.txt
            skills/lithium-battery-downloader/requirements.txt
            skills/lithium-battery-image2ppt/requirements.txt

      - name: Install Image2PPT system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-impress

      - name: Install test dependencies
        run: |
          python -m pip install \
            -c .github/requirements-ci.txt \
            pytest \
            python-docx \
            -r skills/lithium-battery-academic-search/mcp-server/requirements.txt \
            -r skills/lithium-battery-downloader/requirements.txt \
            -r skills/lithium-battery-image2ppt/requirements.txt

      - name: Test lithium-battery-academic-search
        working-directory: skills/lithium-battery-academic-search/mcp-server
        run: python -m pytest -q tests

      - name: Test lithium-battery-citation
        working-directory: skills/lithium-battery-citation
        run: python -m pytest -q tests

      - name: Test lithium-battery-downloader Python tooling
        working-directory: skills/lithium-battery-downloader
        run: python -m pytest -q tests/python

      - name: Test lithium-battery-figure safety helpers
        working-directory: skills/lithium-battery-figure
        run: python -m pytest -q tests

      - name: Test lithium-battery-image2ppt full Linux runtime
        working-directory: skills/lithium-battery-image2ppt
        run: python -m pytest -q tests

      - name: Test lithium-battery-paper-card
        working-directory: skills/lithium-battery-paper-card
        run: python -m pytest -q tests

      - name: Test lithium-battery-proposal-writer
        working-directory: skills/lithium-battery-proposal-writer
        run: python -m pytest -q tests

      - name: Test lithium-battery-paper-to-patent
        working-directory: skills/lithium-battery-paper-to-patent
        run: python -m pytest -q tests

      - name: Test lithium-battery-response package consistency
        working-directory: skills/lithium-battery-response
        run: python -m pytest -q tests

      - name: Test lithium-battery-reviewer instruction contracts
        working-directory: skills/lithium-battery-reviewer
        run: python -m pytest -q tests

      - name: Test lithium-battery-shared consistency tooling
        working-directory: skills/lithium-battery-shared
        run: python -m pytest -q tests

  image2ppt-portable-core:
    name: Image2PPT portable core (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: skills/lithium-battery-image2ppt/requirements.txt

      - name: Install portable dependencies
        run: python -m pip install pytest -r skills/lithium-battery-image2ppt/requirements.txt

      - name: Test portable contracts without Office rendering
        working-directory: skills/lithium-battery-image2ppt
        run: >-
          python -m pytest -q
          tests/test_project_metadata.py
          tests/test_script_inventory.py
          tests/test_formula_renderer.py
          tests/test_console_portability.py
          tests/test_page_hints.py
          tests/test_pdf_backend.py
          tests/test_quality_contracts.py
          tests/test_path_confinement.py
          tests/test_visual_review_evidence.py
          tests/test_migration_parity.py
          tests/test_ocr_http.py
          tests/test_paddle_result_url_safety.py

  javascript-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Test lithium-battery-downloader JavaScript tooling
        working-directory: skills/lithium-battery-downloader
        run: bun test tests/unit

  skill-sync-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test skill install, verification, and drift detection
        env:
          TEST_DEST: ${{ runner.temp }}/nature-skills-sync-test
        run: |
          bash -n scripts/autoupdate-skills.sh
          bash -n scripts/update-codex-skills.sh
          bash scripts/tests/test-autoupdate-state-isolation.sh
          bash scripts/tests/test-update-codex-skills-safety.sh
          bash scripts/tests/test-update-codex-skills-dest-tilde.sh
          bash scripts/tests/test-autoupdate-dest-tilde.sh
          bash scripts/update-codex-skills.sh --dest "$TEST_DEST"
          bash scripts/update-codex-skills.sh --dest "$TEST_DEST" --check
          touch "$TEST_DEST/lithium-battery-writing/unexpected-drift-file"
          if bash scripts/update-codex-skills.sh --dest "$TEST_DEST" --check; then
            echo "Expected verification to detect destination drift."
            exit 1
          fi
